name = "ehrlens-api"
main = "index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set GEMINI_API_KEY as encrypted secret: wrangler secret put GEMINI_API_KEY

[[kv_namespaces]]
# Create with: wrangler kv:namespace create "RATE_LIMIT"
# Paste the returned id below:
binding = "RATE_LIMIT"
id = "1922d6a79e4445e9b6cfe4609702040c"

[observability]
enabled = true
